<!doctype html>
<html lang="ja">
<head><meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>物件シート 225242</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* 物件シート（ひな形）。中身は下の script の BUKKEN だけを書き換えれば、別の物件のシートになる。
   並び（固定。資料レビューの観点.md「物件シート」）：
   1 掲載情報（物件資料の形の1枚）→ 2 外観と内装・図面 → 3 地図の情報 → 4 精査と所感 → 5 懸念点・出典
   印刷：A4縦。項目ごとに新しいページから始める */
:root {
  --bg: #e9edf2; --paper: #ffffff; --ink: #18202e; --muted: #5b6578; --line: #d6dce6; --soft: #f4f6fa;
  --accent: #23407a; --accent-soft: #e5ebf6; --on-accent: #ffffff;
  --ok: #157a4a; --ok-soft: #e3f3ea; --ng: #c0262d; --ng-soft: #fbe6e6; --chk: #b35c00; --chk-soft: #fdf0e0;
  --display: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11151c; --paper: #1a2029; --ink: #e4e9f1; --muted: #9ba5b6; --line: #2e3644; --soft: #212834;
  --accent: #93b2ea; --accent-soft: #24324b; --on-accent: #10151d;
  --ok: #5fd39a; --ok-soft: #173327; --ng: #ff7b7f; --ng-soft: #3a1c1e; --chk: #ffb15c; --chk-soft: #3a2a15; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11151c; --paper: #1a2029; --ink: #e4e9f1; --muted: #9ba5b6; --line: #2e3644; --soft: #212834;
  --accent: #93b2ea; --accent-soft: #24324b; --on-accent: #10151d;
  --ok: #5fd39a; --ok-soft: #173327; --ng: #ff7b7f; --ng-soft: #3a1c1e; --chk: #ffb15c; --chk-soft: #3a2a15; color-scheme: dark; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14.5px; line-height: 1.6;
  padding-block: 20px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sheet { max-width: 1040px; margin: 0 auto; display: grid; gap: 22px; }
.page { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px 22px; min-width: 0; display: grid; gap: 16px; align-content: start; }
.pagelabel { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; border-bottom: 3px solid var(--accent); padding-bottom: 6px; }
.pagelabel .no { font-family: var(--display); font-weight: 900; color: var(--on-accent); background: var(--accent); border-radius: 4px; padding: 0 8px; font-size: .9rem; }
.pagelabel h2 { font-size: 1.2rem; }
.pagelabel small { color: var(--muted); font-size: .8rem; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; word-break: auto-phrase; }
h3 { font-size: 1rem; margin: 0 0 8px; }
h3 small { font-family: var(--body); font-weight: 400; color: var(--muted); font-size: .8rem; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.nw { white-space: nowrap; }
.muted { color: var(--muted); }

/* ===== 1枚目（物件資料の形） ===== */
.band { background: var(--accent); color: var(--on-accent); border-radius: 8px; padding: 12px 16px; display: grid; gap: 6px; }
.band .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.idtag { font-family: var(--display); font-weight: 700; font-size: .82rem; letter-spacing: .06em; opacity: .9; }
.new { font-size: .76rem; font-weight: 700; color: #fff; background: #c0262d; padding: 1px 8px; border-radius: 4px; }
.print { margin-left: auto; font: inherit; font-size: .85rem; font-weight: 700; color: var(--on-accent); background: none; border: 1px solid currentColor; border-radius: 6px; padding: 4px 14px; cursor: pointer; min-height: 34px; }
h1 { font-size: 1.5rem; line-height: 1.35; }
.band .sub { margin: 0; font-size: .88rem; opacity: .92; }
.msg { margin: 0; font-size: .85rem; background: var(--chk-soft); color: var(--chk); padding: 4px 8px; border-radius: 4px; }

.hero { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.hero div { background: var(--accent-soft); border-radius: 8px; padding: 8px 14px; display: grid; }
.hero .lb { font-size: .8rem; font-weight: 700; color: var(--muted); }
.hero .v { font-family: var(--display); font-weight: 900; font-size: 2.2rem; line-height: 1.15; color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums; }
.hero .v small { font-size: 1rem; margin-left: 2px; }
.hero .nt { font-size: .8rem; color: var(--muted); }

.cover { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.coverleft { display: grid; gap: 6px; min-width: 0; }
.shots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.planrow { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.shots.few { grid-template-columns: repeat(2, minmax(0, 1fr)); } .shots.one { grid-template-columns: 1fr; } .planrow.one { grid-template-columns: 1fr; }   /* 写真・図面が少ない物件（左の列を空けない） */
.shot { position: relative; margin: 0; border-radius: 6px; overflow: hidden; background: var(--soft); border: 1px solid var(--line); aspect-ratio: 4 / 3; }
.shot.main { grid-column: 1 / -1; }
.shot.plan { aspect-ratio: 3 / 4; }
.shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.shot.plan img { object-fit: contain; background: #fff; }
.shot figcaption { position: absolute; left: 0; bottom: 0; background: rgba(16, 22, 32, .78); color: #fff; font-size: .74rem; font-weight: 700; padding: 1px 7px; border-top-right-radius: 5px; }

table { border-collapse: collapse; width: 100%; }
.gaiyou { font-size: .86rem; }
.gaiyou th, .gaiyou td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
.gaiyou th { background: var(--accent-soft); color: var(--ink); font-weight: 700; white-space: nowrap; width: 6.6em; }
.gaiyou td b { font-size: 1.05em; }
.nophoto { border: 2px dashed var(--line); border-radius: 6px; padding: 28px 16px; text-align: center; color: var(--muted); font-size: .9rem; }
.toc { display: flex; flex-wrap: wrap; gap: 6px; font-size: .82rem; }
.toc a { text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }

/* ===== 2枚目以降 ===== */
.keys { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.key { border-radius: 8px; padding: 10px 14px 12px; background: var(--soft); border-top: 5px solid var(--muted); display: grid; gap: 2px; align-content: start; }
.key .lb { font-size: .8rem; color: var(--muted); font-weight: 700; }
.key .v { font-family: var(--display); font-weight: 900; font-size: 2rem; line-height: 1.1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.key .v small { font-size: .95rem; font-weight: 700; margin-left: 2px; }
.key .nt { font-size: .8rem; color: var(--muted); }
.key.ok { border-top-color: var(--ok); } .key.ok .v { color: var(--ok); }
.key.ng { border-top-color: var(--ng); } .key.ng .v { color: var(--ng); }
.key.chk { border-top-color: var(--chk); } .key.chk .v { color: var(--chk); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

.concerns { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.concerns li { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; padding: 10px 12px; border-radius: 8px; background: var(--soft); border-left: 5px solid var(--muted); }
.concerns li.hi { border-left-color: var(--ng); background: var(--ng-soft); }
.concerns li.md { border-left-color: var(--chk); background: var(--chk-soft); }
.lv { font-family: var(--display); font-weight: 900; font-size: .82rem; padding: 1px 8px; border-radius: 4px; color: #fff; background: var(--muted); align-self: start; white-space: nowrap; }
.hi .lv { background: var(--ng); } .md .lv { background: var(--chk); }
.concerns b { display: block; }
.concerns p { margin: 2px 0 0; font-size: .9rem; }
.concerns .ask { font-size: .84rem; color: var(--muted); }

/* 所感 */
.shokan { border: 2px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 10px; }
.shokan .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.verdict { font-family: var(--display); font-weight: 900; font-size: 1.1rem; padding: 0 12px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); border: 1px solid currentColor; }
.verdict.mid { background: var(--chk-soft); color: var(--chk); } .verdict.bad { background: var(--ng-soft); color: var(--ng); }
.shokan p { margin: 0; }
.kachi { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; counter-reset: k; }
.kachi li { background: var(--ok-soft); border-left: 5px solid var(--ok); border-radius: 8px; padding: 8px 12px; counter-increment: k; }
.kachi b::before { content: "勝ち筋 " counter(k) "："; color: var(--ok); }
.kachi p { margin: 2px 0 0; font-size: .9rem; }
.kachi .brk { font-size: .84rem; color: var(--muted); }

.tbl { overflow-x: auto; }
.list { font-size: .9rem; }
.list th, .list td { border-bottom: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
.list thead th { background: var(--accent-soft); white-space: nowrap; }
.list tbody th { color: var(--muted); white-space: nowrap; width: 8em; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.money td:first-child { white-space: nowrap; }
.mark { font-family: var(--display); font-weight: 900; white-space: nowrap; }
.mark.ok { color: var(--ok); } .mark.ng { color: var(--ng); } .mark.chk { color: var(--chk); }
.em { font-weight: 700; }
.em.ok { color: var(--ok); } .em.ng { color: var(--ng); } .em.chk { color: var(--chk); }
tr.sum td { font-weight: 700; border-top: 2px solid var(--ink); }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.cols > div { min-width: 0; }
.page > *, .block > * { min-width: 0; }   /* 中の表が広い時に、ページごと横にはみ出さない（スマホ。2026-11-25） */
.formula { font-size: .84rem; color: var(--muted); margin: 6px 0 0; }

.photos { display: grid; gap: 12px; }
.photos.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.photos.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.photos.one { grid-template-columns: minmax(0, 560px); }   /* 1枚だけの時（3列の枠に入れると右が空く。2026-11-25） */
.photos.plan { grid-template-columns: repeat(2, minmax(0, 420px)); }
figure { margin: 0; display: grid; gap: 6px; align-content: start; min-width: 0; }
.frame { aspect-ratio: 4 / 3; background: var(--soft); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.photos.plan .frame { aspect-ratio: 3 / 4; background: #fff; }
.photos.plan.wide1 { grid-template-columns: minmax(0, 760px); }   /* 横長の図面 */
.frame img { width: 100%; height: 100%; object-fit: contain; display: block; }
.frame.crop { aspect-ratio: 800 / 536; }
.frame.clip { position: relative; }
.frame.clip img { position: absolute; max-width: none; object-fit: fill; }
.frame.crop img { object-fit: cover; object-position: center bottom; }
figure.wide { grid-column: 1 / -1; max-width: 800px; width: 100%; justify-self: center; }
figcaption { font-size: .84rem; }
figcaption b { display: block; font-size: .9rem; }
.foot { font-size: .8rem; color: var(--muted); display: grid; gap: 4px; }
.foot p { margin: 0; }

/* ===== 狭い幅（スマホ）===== */
@media screen and (max-width: 820px) {
  .cover, .cols { grid-template-columns: 1fr; }
  .keys { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .photos.g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media screen and (max-width: 560px) {
  .page { padding: 14px 12px 16px; }
  .hero { grid-template-columns: 1fr; }
  .hero div { grid-template-columns: auto 1fr; align-items: baseline; gap: 0 10px; }
  .hero .nt { grid-column: 1 / -1; }
  .hero .v { font-size: 1.9rem; }
  .keys, .photos.g3, .photos.g2, .photos.one, .photos.plan { grid-template-columns: 1fr; }
  .key .v { font-size: 1.85rem; }
  .gaiyou th { width: 5.4em; }
  .list tbody th { width: 5.6em; white-space: normal; }
  table.money td:first-child { white-space: normal; }
  .list thead th { white-space: normal; }   /* 表の見出しを折り返して画面の幅に収める（2026-11-25） */
  .list th, .list td { padding: 6px; }
  .shots { grid-template-columns: repeat(2, minmax(0, 1fr)); }   /* 1枚目の小さい写真は2列（3列だと約100pxで小さすぎる） */
  .shots .shot:not(.main):last-child:nth-child(even) { grid-column: 1 / -1; }
  .shot figcaption, figcaption { font-size: .86rem; }
  table.cards thead { display: none; }
  table.cards tr { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  table.cards td { border: 0; padding: 0; }
  table.cards td:nth-child(1) { font-weight: 700; }
  table.cards td:nth-child(2) { grid-column: 1 / -1; grid-row: 2; font-size: .84rem; color: var(--muted); }
  table.cards td:nth-child(3) { grid-column: 1 / -1; grid-row: 3; }
  table.cards td:nth-child(4) { grid-column: 2; grid-row: 1; }
}

/* ===== 印刷（A4縦） ===== */
@media print {
  @page { size: A4 portrait; margin: 9mm 9mm 12mm;
    @bottom-center { content: "物件シート　" counter(page) " / " counter(pages); font-size: 8pt; color: #5b6578; } }
  :root { --bg: #fff; }
  body { padding: 0; font-size: 9.5pt; background: #fff; }
  .sheet { gap: 0; max-width: none; }
  .page { border: 0; border-radius: 0; padding: 0; gap: 7px; break-before: page; }
  .page:first-child { break-before: auto; }
  .print, .msg, .noprint, .toc { display: none !important; }
  h1 { font-size: 15pt; }
  .band { padding: 8px 12px; gap: 2px; }
  .hero div { padding: 4px 12px; }
  .hero .v { font-size: 18pt; }
  .cover { grid-template-columns: 1.05fr 1fr; gap: 10px; }
  .gaiyou { font-size: 8.6pt; }
  .gaiyou th, .gaiyou td { padding: 2.5px 6px; }
  .legend { font-size: 8pt; }
  .key .v { font-size: 17pt; }
  .key { padding: 4px 9px 6px; border-top-width: 4px; }
  .key .nt { font-size: 7.6pt; line-height: 1.4; }
  .concerns { gap: 5px; }
  .concerns li { padding: 5px 9px; }
  .concerns p, .kachi p, .shokan p { font-size: 8.5pt; line-height: 1.45; }
  .foot p { line-height: 1.35; }
  .concerns li { padding: 4px 8px; }
  .concerns .ask { margin-top: 1px; }
  .concerns .ask, .kachi .brk { font-size: 8.2pt; }
  .kachi { gap: 5px; }
  .kachi li { padding: 5px 9px; }
  .shokan { padding: 7px 10px; gap: 6px; }
  .list { font-size: 8.6pt; }
  .list th, .list td { padding: 3px 6px; line-height: 1.45; }
  .formula { font-size: 8pt; margin-top: 3px; }
  .page h3 { margin-bottom: 4px; }
  .keys { grid-template-columns: repeat(3, 1fr); }
  .cols { grid-template-columns: 1fr 1fr; }
  .photos.g3 { grid-template-columns: repeat(3, 1fr); }
  .photos.g2 { grid-template-columns: repeat(2, 1fr); }
  .photos.one { grid-template-columns: 110mm; }
  .photos.plan { grid-template-columns: repeat(2, 72mm); }
  figure.wide { max-width: 118mm; }
  .photos.g4p { grid-template-columns: repeat(4, 1fr); }
  .foot { break-inside: auto !important; font-size: 7.6pt; }
  .shokan { break-inside: auto; }
  .concerns li, .kachi li, tr, figure, .pgroup, .key, .block { break-inside: avoid; }
  table.cards thead { display: table-header-group; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>

<main class="sheet" id="sheet" aria-live="polite">
  <section class="page"><p>物件シートを組み立てています…</p></section>
</main>

<script>
// ===== 物件シートのひな形。中身は bukken/<id>/data.json に書き、tools/bukken-sheet.js <id> で bukken/<id>.html を作る =====

<script>
// 印刷（2026-11-15 あなたの指示）：公開ページ（Artifact）の枠の中では印刷が止められているので、

(() => {

  if (!btn) return;
  if (framed) {
    const a = document.createElement("a");
    a.href = PRINT_HOST + PATH + "#print"; a.target = "_blank"; a.rel = "noopener";
    a.textContent = "印刷する（Chromeで開く）"; a.className = btn.className;
    a.title = "この PC の Chrome で同じページを開き、印刷の画面を出します。開かない時は手元の印刷用サーバーを起動してください";
    a.style.cssText = "display:inline-flex;align-items:center;text-decoration:none;margin-left:auto";
    btn.replaceWith(a);
  } else if (location.hash === "#print") {
    history.replaceState(null, "", location.pathname);
    const imgs = [...document.images].map((i) => i.complete ? null : new Promise((r) => { i.onload = i.onerror = r; })).filter(Boolean);
    Promise.all([document.fonts ? document.fonts.ready : null, ...imgs]).then(() => setTimeout(() => btn.click(), 400));
  }
})();
