// ひらがな→カタカナ、横棒の揺れ→「ー」、空白は無視、英字は小文字（tools/build-share.js と同じ）
const norm = (s) => s.trim().normalize("NFKC").replace(/[ぁ-ゖ]/g, (c) => String.fromCharCode(c.charCodeAt(0) + 0x60)).replace(/[-‐‑–—―−・･~〜]/g, "ー").replace(/\s+/g, "").toLowerCase();
const ub = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const KEY = "ess-share-pw"; // 同じ GitHub ページの飲食の共有版と混ざらない名前
// 合言葉は複数を通す（tools/hub/share-password.txt の1行に1つ）。中身は1つの鍵で暗号にし、その鍵を合言葉ごとに包んで keys に並べる
async function unlock(pw) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(norm(pw)), "PBKDF2", false, ["deriveKey"]);
  const kek = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: ub(DATA.salt), iterations: 600000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  let raw = null;
  for (const k of DATA.keys) { try { raw = await crypto.subtle.decrypt({ name: "AES-GCM", iv: ub(k.iv) }, kek, ub(k.wk)); break; } catch { /* 次の合言葉 */ } }
  if (!raw) throw new Error("合言葉が違う");
  const ck = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const gz = await crypto.subtle.decrypt({ name: "AES-GCM", iv: ub(DATA.iv) }, ck, ub(DATA.ct));
  return JSON.parse(await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
}
// 開いたら、まとめのページに入れ替える。資料の中身は window.HUB_FILES から読む（まとめのページが見る）
function open_(d) {
  const inject = "<script>window.HUB_FILES=" + JSON.stringify(d.files).replace(/</g, "\\u003c") + "<\/script>";
  const html = d.index.replace("/*FILES*/", () => inject);
  document.open(); document.write(html); document.close();
}
const f = document.getElementById("lock"), pwEl = document.getElementById("pw"), go = document.getElementById("go"), err = document.getElementById("err");
f.addEventListener("submit", async (e) => {
  e.preventDefault(); go.disabled = true; err.textContent = "開いています…";
  let d;
  try { d = await unlock(pwEl.value); } catch { err.textContent = "合言葉が違います。"; go.disabled = false; return; }
  if (document.getElementById("rem").checked) { try { localStorage.setItem(KEY, pwEl.value); } catch {} }
  open_(d);
});
(async () => { let s = ""; try { s = localStorage.getItem(KEY) || ""; } catch {} if (!s) return; err.textContent = "開いています…";
  try { open_(await unlock(s)); } catch { try { localStorage.removeItem(KEY); } catch {} err.textContent = ""; } })();
