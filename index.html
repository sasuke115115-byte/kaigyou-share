<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>資料</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<style>
/* 共有版（合言葉つき）。見た目はまとめページと同じ */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --ink: #1b2130; --muted: #5a6377; --line: #d9dfe8;
  --accent: #2c4884; --accent-soft: #e6ebf6; --warn: #8a3b1e;
  --display: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161d; --surface: #1a2029; --ink: #e3e8f0; --muted: #9aa4b5; --line: #2d3542;
  --accent: #8fb0e8; --accent-soft: #223049; --warn: #f0a07a; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #12161d; --surface: #1a2029; --ink: #e3e8f0; --muted: #9aa4b5; --line: #2d3542;
  --accent: #8fb0e8; --accent-soft: #223049; --warn: #f0a07a; color-scheme: dark; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.6; display: flex; flex-direction: column; }
.top { background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.row1 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
h1 { font-family: var(--display); font-size: 1.25rem; margin: 0; letter-spacing: .04em; }
.lead { color: var(--muted); font-size: .82rem; margin: 0; flex: 1 1 260px; min-width: 0; }
.hubs { display: flex; gap: 6px; flex-wrap: wrap; }
.printlink { font-size: .8rem; padding: 3px 12px; border: 1px solid var(--accent); color: var(--accent); border-radius: 6px; text-decoration: none; white-space: nowrap; font-weight: 700; }
.printlink:hover { background: var(--accent-soft); }
.hubs button { font: inherit; font-size: .78rem; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); background: none; color: var(--muted); white-space: nowrap; cursor: pointer; }
.hubs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 700; cursor: default; }
.hubs button:hover { border-color: var(--accent); }
.hubs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
nav { display: flex; gap: 2px 18px; overflow-x: auto; margin-top: 8px; scrollbar-width: thin; }
.grp { display: flex; align-items: flex-end; gap: 2px; flex: none; }
.grp > b { font-size: .68rem; color: var(--muted); letter-spacing: .08em; font-weight: 700; padding: 0 4px 9px 0; white-space: nowrap; }
.tab { font: inherit; font-size: .86rem; border: 0; background: none; color: var(--muted); padding: 6px 10px 8px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
.tab .ext { font-size: .72rem; margin-left: 3px; }
.tab:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { flex: 1; min-height: 0; position: relative; }
iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--surface); }
.doc { position: absolute; inset: 0; overflow: auto; }
.md { max-width: 860px; margin: 0 auto; background: var(--surface);
  padding-block: 18px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.md h1 { font-size: 1.3rem; margin: 6px 0 12px; } .md h2 { font-family: var(--display); font-size: 1.08rem; margin: 22px 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 3px; }
.md h3 { font-size: .98rem; margin: 16px 0 6px; }
.md table { border-collapse: collapse; font-size: .84rem; display: block; overflow-x: auto; max-width: 100%; }
.md th, .md td { border: 1px solid var(--line); padding: 3px 8px; vertical-align: top; }
.md th { background: var(--accent-soft); white-space: nowrap; }
.md code { font-size: .85em; background: var(--accent-soft); padding: 0 4px; border-radius: 3px; }
.md a { color: var(--accent); }
.src { font-size: .76rem; color: var(--muted); margin: 0 0 8px; }
.card { max-width: 560px; margin: 40px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px 22px; }
.card h2 { font-family: var(--display); font-size: 1.1rem; margin: 0 0 6px; }
.card p { margin: 6px 0; color: var(--muted); }
.card a.go { display: inline-block; margin-top: 10px; background: var(--accent); color: var(--surface); text-decoration: none; padding: 7px 16px; border-radius: 6px; font-weight: 700; }
.err { color: var(--warn); }
.lock { margin: auto; width: min(360px, calc(100% - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 22px; }
.lock h1 { margin-bottom: 6px; }
.lock p { color: var(--muted); font-size: .85rem; margin: 4px 0 12px; }
.lock input[type=password] { font: inherit; width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
.lock label.rem { display: flex; gap: 6px; align-items: center; font-size: .82rem; color: var(--muted); margin: 10px 0; }
.lock button { font: inherit; width: 100%; padding: 8px; border: 0; border-radius: 6px; background: var(--accent); color: var(--surface); font-weight: 700; cursor: pointer; }
.lock button:disabled { opacity: .6; cursor: wait; }
.lock .err { font-size: .85rem; min-height: 1.4em; margin: 8px 0 0; }
button.printlink { font: inherit; font-size: .8rem; background: none; cursor: pointer; }
</style>
</head><body>
<form class="lock" id="lock">
  <h1>資料</h1>
  <p>合言葉を入れてください（ひらがなのままでも開きます）。</p>
  <input type="text" id="pw" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="合言葉" required>
  <label class="rem"><input type="checkbox" id="rem">この端末で覚える</label>
  <button type="submit" id="go">開く</button>
  <p class="err" id="lockerr" role="alert"></p>
</form>
<div class="top" id="top" hidden>
  <div class="row1">
    <h1 id="ttl"></h1>
    <p class="lead" id="lead"></p>
    <div class="hubs" id="hubs" aria-label="まとめの切り替え"></div>
    <button type="button" class="printlink" id="printlink" hidden>印刷する</button>
  </div>
  <nav id="nav" role="tablist" aria-label="資料"></nav>
</div>

// 合言葉の書き方の揺れを吸収：ひらがな→カタカナ、「-」「・」などの横棒→「ー」、空白は無視（2026-11-17）
const norm = (s) => s.trim().normalize("NFKC").replace(/[ぁ-ゖ]/g, (c) => String.fromCharCode(c.charCodeAt(0) + 0x60)).replace(/[-‐‑–—―−・･~〜]/g, "ー").replace(/\s+/g, "");
const ub = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function unlock(pw) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(norm(pw)), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: ub(DATA.salt), iterations: 600000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const gz = await crypto.subtle.decrypt({ name: "AES-GCM", iv: ub(DATA.iv) }, key, ub(DATA.ct));
  const txt = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  return JSON.parse(txt);
}
const lock = document.getElementById("lock"), pwEl = document.getElementById("pw"), go = document.getElementById("go"), lockerr = document.getElementById("lockerr");
lock.addEventListener("submit", async (e) => {
  e.preventDefault(); go.disabled = true; lockerr.textContent = "開いています…";
  try {
    const d = await unlock(pwEl.value);
    if (document.getElementById("rem").checked) { try { localStorage.setItem("share-pw", pwEl.value); } catch {} }
    start(d);
  } catch { lockerr.textContent = "合言葉が違います。"; go.disabled = false; }
});
(async () => { let s = ""; try { s = localStorage.getItem("share-pw") || ""; } catch {} if (s) { try { start(await unlock(s)); } catch { try { localStorage.removeItem("share-pw"); } catch {} } } })();

let ALL, FILES, HUB;
const nav = document.getElementById("nav"), main = document.getElementById("main"), hubsEl = document.getElementById("hubs"), pl = document.getElementById("printlink");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
function start(d) {
  ALL = d.hubs; FILES = d.files; HUB = ALL[0];
  lock.hidden = true; document.getElementById("top").hidden = false; main.hidden = false;
  drawHub();
  const first = location.hash.slice(1);
  show(hubOf(first) ? first : lastTab(HUB));
}
function drawHub() {
  document.getElementById("ttl").textContent = HUB.title;
  document.getElementById("lead").textContent = HUB.lead;
  document.title = HUB.title;
  hubsEl.innerHTML = ALL.map((h) => `<button type="button" data-hub="${h.id}" aria-pressed="${h.id === HUB.id}">${esc(h.title)}</button>`).join("");
  const groups = [];
  HUB.tabs.forEach((t) => { let g = groups.find((x) => x.name === t.group); if (!g) groups.push(g = { name: t.group, tabs: [] }); g.tabs.push(t); });
  nav.innerHTML = groups.map((g) => `<div class="grp"><b>${g.name}</b>${g.tabs.map((t) =>
    `<button class="tab" role="tab" id="tab-${t.id}" data-id="${t.id}" aria-selected="false">${t.label}${t.link ? '<span class="ext">↗</span>' : ""}</button>`).join("")}</div>`).join("");
}
function hubOf(id) { return ALL && ALL.find((h) => h.tabs.some((t) => t.id === id)); }
function lastTab(h) { let id = ""; try { id = localStorage.getItem("share-tab-" + h.id) || ""; } catch {} return h.tabs.some((t) => t.id === id) ? id : h.tabs[0].id; }
function show(id) {
  const owner = hubOf(id);
  if (owner && owner !== HUB) { HUB = owner; drawHub(); }
  const t = HUB.tabs.find((x) => x.id === id) || HUB.tabs[0];
  nav.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.id === t.id)));
  document.getElementById("tab-" + t.id)?.scrollIntoView({ block: "nearest", inline: "nearest" });
  if (location.hash !== "#" + t.id) history.replaceState(null, "", "#" + t.id);
  try { localStorage.setItem("share-tab-" + HUB.id, t.id); } catch {}
  pl.hidden = !t.page;
  if (t.page) { const f = document.createElement("iframe"); f.title = t.label; f.srcdoc = FILES[t.id]; main.replaceChildren(f); return; }
  if (t.link) { main.innerHTML = `<div class="doc"><div class="card"><h2>${esc(t.label)}</h2><p>${esc(t.note || "")}</p><p>この資料は別のページです（Claude のアカウントが要ります）。</p><a class="go" href="${t.link}" target="_blank" rel="noopener">開く</a></div></div>`; return; }
  const body = FILES[t.id] || "";
  main.innerHTML = `<div class="doc"><article class="md"><div id="mdbody"></div></article></div>`;
  document.getElementById("mdbody").innerHTML = window.marked ? marked.parse(body) : `<pre style="white-space:pre-wrap">${esc(body)}</pre>`;
}
pl.addEventListener("click", () => { const f = main.querySelector("iframe"); if (f) f.contentWindow.print(); });
nav.addEventListener("click", (e) => { const b = e.target.closest(".tab"); if (b) show(b.dataset.id); });
hubsEl.addEventListener("click", (e) => { const b = e.target.closest("button[data-hub]"); if (!b || b.dataset.hub === HUB.id) return; HUB = ALL.find((h) => h.id === b.dataset.hub); drawHub(); show(lastTab(HUB)); });
window.addEventListener("hashchange", () => { if (ALL) show(location.hash.slice(1)); });
</script>
</body></html>
